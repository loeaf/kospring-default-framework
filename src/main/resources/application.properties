spring.profiles.active=dev
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JPA/Hibernate 설정

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Naver API settings (임시 더미 값)
social.client.naver.rest-api-key=dummy-naver-api-key
social.client.naver.secret-key=dummy-naver-secret-key
social.client.naver.redirect-uri=http://localhost:8080/naver/callback
social.client.naver.grant_type=authorization_code

# Jackson 설정 - boolean 필드명 보존
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.mapper.use-std-bean-naming=true

spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800

spring.data.redis.host=211.230.2.71
spring.data.redis.port=50026
spring.data.redis.password=
spring.data.redis.timeout=60000
spring.data.redis.database=0


# Jackson Kotlin 모듈 설정
spring.jackson.module.kotlin.enabled=true
spring.jackson.module.kotlin.null-to-empty-collection=true
spring.jackson.module.kotlin.null-to-empty-map=true

# 기본 생성자 관련 설정
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# HTTP 요청/응답 로깅
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.web=DEBUG

# 요청 매개변수 로깅
spring.mvc.log-request-details=true

